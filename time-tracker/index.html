<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Tracker</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --border: #d9dde3;
      --text: #1c2128;
      --muted: #626b76;
      --accent: #2f6feb;
      --accent-text: #ffffff;
      --danger: #b3372f;
      --running: #1f8b4c;
      --radius: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171c;
        --panel: #1c2027;
        --border: #333a44;
        --text: #e6e9ee;
        --muted: #9aa3b0;
        --accent: #4b83f0;
        --accent-text: #ffffff;
        --danger: #e56a62;
        --running: #4cc38a;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 2rem 1rem 4rem;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    main {
      max-width: 46rem;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 1.25rem;
    }

    h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      margin: 1.75rem 0 0.5rem;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
    }

    .tracker {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    input[type="text"], input[type="datetime-local"] {
      flex: 1 1 14rem;
      min-width: 0;
      padding: 0.55rem 0.7rem;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    input:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    button {
      padding: 0.55rem 1rem;
      font: inherit;
      font-weight: 600;
      color: var(--accent-text);
      background: var(--accent);
      border: 1px solid transparent;
      border-radius: var(--radius);
      cursor: pointer;
    }

    button.secondary {
      color: var(--text);
      background: transparent;
      border-color: var(--border);
      font-weight: 400;
    }

    button.link {
      padding: 0.15rem 0.35rem;
      color: var(--muted);
      background: none;
      border: none;
      font-weight: 400;
      font-size: 0.85rem;
    }

    button.link:hover { color: var(--text); }
    button.link.danger:hover { color: var(--danger); }

    .elapsed {
      font-variant-numeric: tabular-nums;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      min-width: 6.5rem;
      text-align: right;
    }

    .elapsed.running { color: var(--running); }

    .hint {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 0.6rem 0 0;
    }

    .day {
      margin-top: 1.25rem;
    }

    .day-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      padding: 0 0.25rem 0.35rem;
      border-bottom: 1px solid var(--border);
    }

    .day-head strong { font-size: 0.95rem; }

    .day-total {
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      font-size: 0.9rem;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li.entry {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.75rem;
      align-items: center;
      padding: 0.6rem 0.25rem;
      border-bottom: 1px solid var(--border);
    }

    li.entry .task {
      flex: 1 1 12rem;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    li.entry .span {
      color: var(--muted);
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
    }

    li.entry .duration {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      min-width: 5rem;
      text-align: right;
    }

    li.entry.is-running .duration { color: var(--running); }

    .empty {
      color: var(--muted);
      padding: 1rem 0.25rem;
    }

    .summary {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 1.5rem;
      padding-top: 0.75rem;
      border-top: 2px solid var(--border);
      font-weight: 600;
    }

    .summary .value { font-variant-numeric: tabular-nums; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1.25rem;
    }

    form.manual {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.75rem;
    }

    form.manual label {
      color: var(--muted);
      font-size: 0.85rem;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Time Tracker</h1>

    <div class="panel">
      <div class="tracker">
        <input type="text" id="task" placeholder="What are you working on?" autocomplete="off" aria-label="Task name">
        <span class="elapsed" id="elapsed">0:00:00</span>
        <button type="button" id="toggle">Start</button>
      </div>
      <p class="hint" id="hint">Press Enter to start tracking. A running timer survives a page reload.</p>
    </div>

    <h2>Entries</h2>
    <div id="entries"></div>

    <div class="summary">
      <span>Total tracked</span>
      <span class="value" id="total">0:00:00</span>
    </div>

    <div class="toolbar">
      <button type="button" class="secondary" id="add-manual">Add entry manually</button>
      <button type="button" class="secondary" id="export">Export CSV</button>
      <button type="button" class="secondary" id="clear">Clear all</button>
    </div>

    <form class="manual" id="manual" hidden>
      <input type="text" id="manual-task" placeholder="Task" aria-label="Task name" required>
      <label for="manual-start">From</label>
      <input type="datetime-local" id="manual-start" required>
      <label for="manual-end">to</label>
      <input type="datetime-local" id="manual-end" required>
      <button type="submit">Add</button>
      <button type="button" class="secondary" id="manual-cancel">Cancel</button>
    </form>
  </main>

  <script>
    (function () {
      var STORAGE_KEY = "time-tracker/v1";
      var state = { entries: [], running: null };
      var ticker = null;

      var els = {
        task: document.getElementById("task"),
        elapsed: document.getElementById("elapsed"),
        toggle: document.getElementById("toggle"),
        hint: document.getElementById("hint"),
        entries: document.getElementById("entries"),
        total: document.getElementById("total"),
        manual: document.getElementById("manual"),
        manualTask: document.getElementById("manual-task"),
        manualStart: document.getElementById("manual-start"),
        manualEnd: document.getElementById("manual-end")
      };

      function load() {
        var raw;
        try {
          raw = window.localStorage.getItem(STORAGE_KEY);
        } catch (err) {
          return;
        }
        if (!raw) return;
        try {
          var saved = JSON.parse(raw);
          if (saved && Array.isArray(saved.entries)) {
            state.entries = saved.entries.filter(function (entry) {
              return entry && typeof entry.start === "number" && typeof entry.end === "number";
            });
          }
          if (saved && saved.running && typeof saved.running.start === "number") {
            state.running = { task: String(saved.running.task || ""), start: saved.running.start };
          }
        } catch (err) {
          /* Corrupt payload: start clean rather than break the page. */
        }
      }

      function save() {
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          /* Private mode or a full quota: keep running in memory. */
        }
      }

      function formatDuration(ms) {
        var total = Math.max(0, Math.floor(ms / 1000));
        var hours = Math.floor(total / 3600);
        var minutes = Math.floor((total % 3600) / 60);
        var seconds = total % 60;
        return hours + ":" + String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
      }

      function formatClock(ms) {
        var date = new Date(ms);
        return String(date.getHours()).padStart(2, "0") + ":" + String(date.getMinutes()).padStart(2, "0");
      }

      function dayKey(ms) {
        var date = new Date(ms);
        return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0");
      }

      function formatDay(ms) {
        return new Date(ms).toLocaleDateString(undefined, {
          weekday: "long", year: "numeric", month: "short", day: "numeric"
        });
      }

      function localInputValue(ms) {
        var date = new Date(ms - new Date(ms).getTimezoneOffset() * 60000);
        return date.toISOString().slice(0, 16);
      }

      function visibleEntries() {
        var all = state.entries.slice();
        if (state.running) {
          all.push({ task: state.running.task, start: state.running.start, end: Date.now(), live: true });
        }
        return all.sort(function (a, b) { return b.start - a.start; });
      }

      function groupByDay(entries) {
        var groups = [];
        var index = {};
        entries.forEach(function (entry) {
          var key = dayKey(entry.start);
          if (!index[key]) {
            index[key] = { key: key, start: entry.start, entries: [], total: 0 };
            groups.push(index[key]);
          }
          index[key].entries.push(entry);
          index[key].total += entry.end - entry.start;
        });
        return groups;
      }

      function renderEntries() {
        var entries = visibleEntries();
        els.entries.textContent = "";

        if (!entries.length) {
          var empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "No entries yet.";
          els.entries.appendChild(empty);
          els.total.textContent = formatDuration(0);
          return;
        }

        groupByDay(entries).forEach(function (group) {
          var section = document.createElement("section");
          section.className = "day";

          var head = document.createElement("div");
          head.className = "day-head";
          var name = document.createElement("strong");
          name.textContent = formatDay(group.start);
          var total = document.createElement("span");
          total.className = "day-total";
          total.textContent = formatDuration(group.total);
          head.appendChild(name);
          head.appendChild(total);
          section.appendChild(head);

          var list = document.createElement("ul");
          group.entries.forEach(function (entry) {
            list.appendChild(renderEntry(entry));
          });
          section.appendChild(list);
          els.entries.appendChild(section);
        });

        els.total.textContent = formatDuration(entries.reduce(function (sum, entry) {
          return sum + (entry.end - entry.start);
        }, 0));
      }

      function renderEntry(entry) {
        var item = document.createElement("li");
        item.className = "entry" + (entry.live ? " is-running" : "");

        var task = document.createElement("span");
        task.className = "task";
        task.textContent = entry.task || "(no description)";

        var span = document.createElement("span");
        span.className = "span";
        span.textContent = formatClock(entry.start) + "–" + (entry.live ? "now" : formatClock(entry.end));

        var duration = document.createElement("span");
        duration.className = "duration";
        duration.textContent = formatDuration(entry.end - entry.start);

        item.appendChild(task);
        item.appendChild(span);
        item.appendChild(duration);

        if (!entry.live) {
          var resume = document.createElement("button");
          resume.type = "button";
          resume.className = "link";
          resume.textContent = "resume";
          resume.addEventListener("click", function () {
            if (state.running) stop();
            start(entry.task);
          });

          var remove = document.createElement("button");
          remove.type = "button";
          remove.className = "link danger";
          remove.textContent = "delete";
          remove.addEventListener("click", function () {
            var at = state.entries.indexOf(entry);
            if (at > -1) state.entries.splice(at, 1);
            save();
            render();
          });

          item.appendChild(resume);
          item.appendChild(remove);
        }

        return item;
      }

      function renderTracker() {
        var running = Boolean(state.running);
        if (running && document.activeElement !== els.task) els.task.value = state.running.task;
        els.toggle.textContent = running ? "Stop" : "Start";
        els.elapsed.classList.toggle("running", running);
        els.elapsed.textContent = formatDuration(running ? Date.now() - state.running.start : 0);
        els.hint.textContent = running
          ? "Tracking since " + formatClock(state.running.start) + "."
          : "Press Enter to start tracking. A running timer survives a page reload.";
        document.title = running
          ? els.elapsed.textContent + " · " + (state.running.task || "Time Tracker")
          : "Time Tracker";
      }

      function render() {
        renderTracker();
        renderEntries();
      }

      function tick() {
        renderTracker();
        var live = els.entries.querySelector(".entry.is-running");
        if (live && state.running) {
          live.querySelector(".duration").textContent = formatDuration(Date.now() - state.running.start);
          var day = els.entries.querySelector(".day .day-total");
          if (day) renderEntries();
        }
      }

      function startTicking() {
        if (ticker === null) ticker = window.setInterval(tick, 1000);
      }

      function stopTicking() {
        if (ticker !== null) {
          window.clearInterval(ticker);
          ticker = null;
        }
      }

      function start(task) {
        state.running = { task: (task || els.task.value).trim(), start: Date.now() };
        els.task.value = state.running.task;
        save();
        render();
        startTicking();
      }

      function stop() {
        if (!state.running) return;
        var entry = { task: state.running.task, start: state.running.start, end: Date.now() };
        if (entry.end - entry.start >= 1000) state.entries.push(entry);
        state.running = null;
        els.task.value = "";
        stopTicking();
        save();
        render();
      }

      els.toggle.addEventListener("click", function () {
        if (state.running) stop();
        else start();
      });

      els.task.addEventListener("keydown", function (event) {
        if (event.key !== "Enter") return;
        event.preventDefault();
        if (state.running) stop();
        else start();
      });

      document.getElementById("add-manual").addEventListener("click", function () {
        var now = Date.now();
        els.manual.hidden = !els.manual.hidden;
        if (els.manual.hidden) return;
        els.manualStart.value = localInputValue(now - 3600000);
        els.manualEnd.value = localInputValue(now);
        els.manualTask.focus();
      });

      document.getElementById("manual-cancel").addEventListener("click", function () {
        els.manual.hidden = true;
      });

      els.manual.addEventListener("submit", function (event) {
        event.preventDefault();
        var start = new Date(els.manualStart.value).getTime();
        var end = new Date(els.manualEnd.value).getTime();
        if (!isFinite(start) || !isFinite(end) || end <= start) {
          window.alert("The end time has to be after the start time.");
          return;
        }
        state.entries.push({ task: els.manualTask.value.trim(), start: start, end: end });
        els.manualTask.value = "";
        els.manual.hidden = true;
        save();
        render();
      });

      document.getElementById("export").addEventListener("click", function () {
        var rows = [["task", "start", "end", "seconds"]];
        state.entries.slice().sort(function (a, b) { return a.start - b.start; }).forEach(function (entry) {
          rows.push([
            entry.task,
            new Date(entry.start).toISOString(),
            new Date(entry.end).toISOString(),
            String(Math.round((entry.end - entry.start) / 1000))
          ]);
        });
        var csv = rows.map(function (row) {
          return row.map(function (cell) {
            return '"' + String(cell).replace(/"/g, '""') + '"';
          }).join(",");
        }).join("\n");
        var link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
        link.download = "time-tracker.csv";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
      });

      document.getElementById("clear").addEventListener("click", function () {
        if (!window.confirm("Delete all entries and stop the running timer?")) return;
        state = { entries: [], running: null };
        els.task.value = "";
        stopTicking();
        save();
        render();
      });

      load();
      render();
      if (state.running) startTicking();
    }());
  </script>
</body>
</html>
